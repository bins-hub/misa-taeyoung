name: Notify IndexNow after site update
on:
  push:
    branches: [main]
    paths:
      - index.html
      - listings.json
      - llms.txt
      - sitemap.xml
      - assets/**
      - 85ae65fb72e3e12d8c0619230323aed86.txt
      - .github/workflows/indexnow.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: misa-taeyoung-indexnow
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed content and submit
        env:
          SITE: https://bins-hub.github.io/misa-taeyoung/
          KEY: 85ae65fb72e3e12d8c0619230323aed86
        run: |
          python3 - <<'PY'
          import os, time, json, pathlib, urllib.request, urllib.error
          site, key = os.environ['SITE'], os.environ['KEY']
          key_url = site + key + '.txt'
          files = {'': 'index.html', 'listings.json': 'listings.json', 'llms.txt': 'llms.txt', 'sitemap.xml': 'sitemap.xml'}
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'MisaTaeyoung-IndexNow/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=12) as res:
                  return res.read()
          for attempt in range(36):
              try:
                  stamp = str(int(time.time()))
                  if get(key_url + '?v=' + stamp).decode().strip() == key and all(get(site + url + '?v=' + stamp).strip() == pathlib.Path(path).read_bytes().strip() for url, path in files.items()):
                      print('Verified deployed key and current site files.')
                      break
              except (OSError, urllib.error.URLError) as exc:
                  print('Awaiting deployment:', exc)
              time.sleep(12)
          else:
              raise SystemExit('Public deployment not verified; submission skipped.')
          payload = json.dumps({'host': 'bins-hub.github.io', 'key': key, 'keyLocation': key_url, 'urlList': [site]}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=payload, headers={'Content-Type': 'application/json; charset=utf-8'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as res:
              print('IndexNow response:', res.status)
              if res.status not in (200, 202):
                  raise SystemExit('Unexpected IndexNow response')
          PY
